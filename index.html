<!doctype html>
<html lang="en" data-theme="academy" data-world="academy" data-mode="dark" data-motion="on">
<head>
<meta charset="utf-8">
<meta name="cozynovel-commit" content="">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Cozy Novel</title>
<meta name="theme-color" content="#131e21">
<meta name="description" content="A cozy room to write your novel in.">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preload" href="assets/fonts/literata-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/cormorant-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/novel.css">
<link rel="stylesheet" href="css/checks.css">
<link rel="stylesheet" href="css/settings.css">
<link rel="stylesheet" href="css/panes.css">
<link rel="stylesheet" href="css/dialogs.css">
<link rel="stylesheet" href="css/worlds.css">
<link rel="stylesheet" href="css/academy.css">
<link rel="stylesheet" href="css/tokyo.css">
<link rel="stylesheet" href="css/neon.css">
<link rel="stylesheet" href="css/study.css">
</head>
<body class="shelfview">
<div class="room" aria-hidden="true"></div>

<main id="shelf" hidden>
  <div class="shelf-inner">
  <header class="shelf-head">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">❦</span>
      <div>
      <h1>Cozy Novel</h1>
      <p>a little room for a whole world</p>
      </div>
    </div>
    <button class="icon" id="shelfSettings" aria-label="Settings" title="Settings">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 8.9 19.3a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.7 15a1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.7 8.9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1.03-1.56V3a2 2 0 1 1 4 0v.09A1.7 1.7 0 0 0 15 4.7a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.3 9v.03A1.7 1.7 0 0 0 21 10.06H21a2 2 0 1 1 0 4h-.09A1.7 1.7 0 0 0 19.4 15z"/></svg>
    </button>
  </header>
  <div class="world-toolbar" role="group" aria-label="Your writing room">
    <div class="world-choices" role="group" aria-label="Choose your world">
      <button id="worldAcademy" aria-pressed="true" title="Academy of Ink — a candlelit library for worlds waiting to be written"><span aria-hidden="true">✦</span> Academy of Ink</button>
      <button id="worldTokyo" aria-pressed="false" title="Neon Tokyo — a rain-wet street of glowing signs, lit through the night"><span aria-hidden="true">◈</span> Neon Tokyo</button>
      <button id="worldStudy" aria-pressed="false" title="Original Study — the rainy window, lamplight and familiar room"><span aria-hidden="true">❧</span> Original Study</button>
    </div>
    <div class="world-light-controls">
      <button id="modeToggle" aria-label="Switch to light mode" title="Let the morning into your writing room"><svg class="mode-moon" aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20.5 14A8.5 8.5 0 0 1 10 3.5 8.5 8.5 0 1 0 20.5 14Z"/></svg><svg class="mode-sun" aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg><span class="mode-word">Night</span></button>
      <button id="motionToggle" aria-label="Ambient animation" aria-pressed="true" title="Pause the room’s ambient animation"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path class="motion-waves" d="M3 8c3-4 6 4 9 0s6 4 9 0M3 16c3-4 6 4 9 0s6 4 9 0"/><path class="motion-pause" d="M9 6v12m6-12v12"/></svg></button>
    </div>
  </div>
  <section class="shelf-intro" id="shelfIntro" aria-labelledby="shelfGreeting">
    <div class="shelf-welcome">
      <p class="eyebrow" id="shelfEyebrow">YOUR WRITING ROOM</p>
      <h2 id="shelfGreeting">A little room.<br>A whole world.</h2>
      <p class="shelf-invitation" id="shelfInvitation">Settle in. There’s a story only you can tell.</p>
    </div>
    <div id="shelfResume" hidden></div>
  </section>
  <div class="shelf-actions">
    <div class="collection-heading"><h2 id="shelfCollectionTitle">Your books</h2><span id="shelfCount"></span></div>
    <input class="shelf-search" id="search" type="search" placeholder="Find a book" aria-label="Find a book" hidden></div>
  <section class="books" id="books" aria-label="Your books"></section>
  <footer class="shelf-foot" id="shelfFoot"></footer>
  </div>
</main>

<main id="desk" hidden>
  <header class="deskbar">
    <button class="icon" id="toShelf" aria-label="Back to your books" title="Your books">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <button class="booktitle" id="bookTitle" title="Chapters" aria-label="Chapters"><b></b><small><span id="chapLine"></span><span id="whereNow"></span></small></button>
    <button class="icon notesbtn" id="notesBtn" aria-label="Notes" title="Notes">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.5h9l3 3V20.5H6z"/><path d="M9 9.5h6M9 13h6M9 16.5h4"/></svg>
      <span class="dot" aria-hidden="true"></span>
    <span class="tool-label" aria-hidden="true">Notes</span></button>
    <button class="icon" id="partnerBtn" aria-label="Partner" title="Partner">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5h16v10H9l-5 4z"/></svg>
    <span class="tool-label" aria-hidden="true">Partner</span></button>
    <button class="icon" id="searchBtn" aria-label="Search" title="Search">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
    <span class="tool-label" aria-hidden="true">Search</span></button>
    <button class="icon" id="moreBtn" aria-label="More" title="More">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg>
    <span class="tool-label" aria-hidden="true">More</span></button>
  </header>

  <div class="scrim" id="scrim"></div>
  <div class="deskbody">
    <aside class="pane left" id="chaptersPane" aria-label="Chapters">
      <div class="panehead"><h2 id="chaptersTitle">Chapters</h2><button class="icon" id="chaptersClose" aria-label="Close"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
      <div class="panebody" id="chaptersBody"></div>
    </aside>

    <div class="pagecol">
      <section class="pagewrap" id="pageWrap">
        <article class="page" id="page">
          <header class="chapterhead">
            <p class="chapnum" id="chapnum"></p>
            <h1 class="chapname" id="chapname" contenteditable="plaintext-only" spellcheck="false" aria-label="The chapter's name" title="Name this chapter — tap here to change it"></h1>
          </header>
          <div id="passages"></div>
          <div id="pageEnd"></div>
        </article>
        <button class="btn small follow" id="followBtn" hidden>Follow the writing &darr;</button>
      </section>
      <button class="checkbubble" id="checkBubble" data-state="clean" aria-label="Suggestions" title="The checker: green all good, blue checking, yellow suggestions waiting, red trouble, grey nobody checks"></button>
      <div class="scroller" id="scroller" hidden><div class="tip" aria-hidden="true"></div><div class="thumb" role="slider" tabindex="0" aria-label="Passage" aria-valuemin="1"></div></div>
    </div>

    <aside class="pane right" id="sidePane" aria-label="Notes, partner and scenes">
      <div class="panehead">
        <div class="tabs" id="sideTabs" role="tablist" style="flex:1;padding:0">
          <button data-tab="notes" role="tab">Notes</button>
          <button data-tab="partner" role="tab">Partner</button>
          <button data-tab="play" role="tab">Scenes</button>
        </div>
        <button class="icon" id="sideClose" aria-label="Close"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <div class="panebody" id="sideBody"></div>
      <div class="talkbox" id="sideFoot" hidden></div>
    </aside>
  </div>

  <footer class="composer">
    <div class="inner">
      <div class="selbar" id="selBar" hidden>
        <span class="what" id="selWhat"></span>
        <button class="btn small quiet" id="selClear" aria-label="Never mind" title="Never mind">&times;</button>
      </div>
      <div class="say-row">
        <textarea id="direction" rows="1" placeholder="What happens next?" aria-label="What happens next" autocapitalize="sentences" spellcheck="true"></textarea>
        <button class="btn primary" id="writeBtn" title="Write what the box says happens next (empty: the story carries on)">Write</button>
      </div>
      <div class="crow">
        <button class="chip" id="lengthBtn" aria-label="How much to write" title="How much the writer writes for one Write"></button>
        <button class="chip" id="outcomeBtn" aria-label="Who decides how it turns out" title="Writer decides: it carries your premise to where it lands. I decide: it stops right before it is settled"></button>
        <button class="chip" id="writerBtn" aria-label="Who writes" title="Which connection writes the pages"></button>
        <button class="chip" id="ideasBtn" aria-label="Ideas for what happens next" title="A few premises for what happens next — a tap puts one in the box" hidden>Ideas</button>
        <span class="grow"></span>
        <button class="chip mine" id="mineBtn" title="Put the words in the box onto the page as your own">Add as my words</button>
      </div>
    </div>
  </footer>
</main>

<div class="banner" id="banner" hidden role="alert"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
